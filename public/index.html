<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شات عربي - نموذج أولي (v2.15)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ec;--sf:#fff;--tx:#1d2330;--mu:#6b7280;--ac:#0f766e;--ac2:#fff;--bd:#e2ddd5;--me:#d9f2ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--sf:#1a212b;--tx:#e8ecf2;--mu:#98a2b3;--ac:#2dd4bf;--ac2:#06201d;--bd:#2c3644;--me:#12413c}}
:root[data-theme="dark"]{--bg:#10151c;--sf:#1a212b;--tx:#e8ecf2;--mu:#98a2b3;--ac:#2dd4bf;--ac2:#06201d;--bd:#2c3644;--me:#12413c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{background:var(--ac);color:var(--ac2);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%;font-size:16px}
#login{display:flex;align-items:center;justify-content:center;min-height:100%;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:22px;width:100%;max-width:380px;display:grid;gap:10px}
h1{margin:0;font-size:22px;color:var(--ac)}small,.mu{color:var(--mu);font-size:12.5px}
#app{display:none;height:100%;grid-template-rows:auto 1fr}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header select{width:auto}header b{color:var(--ac)}.sp{flex:1}
main{display:grid;grid-template-columns:1fr;min-height:0}
#chat{display:grid;grid-template-rows:auto 1fr auto auto auto;min-height:0}
#msgs{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{background:var(--m1,var(--sf));border:1px solid var(--bd);border-radius:10px;padding:6px 10px;width:100%;word-break:break-word;display:flex;gap:8px;align-items:flex-start}
.m.me{background:var(--me);align-self:flex-start}.m.sys{display:block;text-align:center;align-self:center;background:none;border:0;color:var(--mu);font-size:12.5px}
.n{font-weight:700;font-size:13px}.bd{font-size:11px;border-radius:6px;padding:1px 6px;margin-inline-start:4px;background:var(--bd);color:var(--tx)}
#bar{display:flex;gap:6px;padding:8px;background:var(--sf);border-top:1px solid var(--bd)}
#bar input{flex:1}
aside{position:fixed;top:0;right:0;bottom:0;width:260px;max-width:85%;background:var(--sf);border-left:1px solid var(--bd);overflow:auto;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));z-index:8;transform:translateX(100%);transition:transform .25s}
aside.open{transform:none}
#ov{position:fixed;inset:0;background:#0005;opacity:0;pointer-events:none;transition:opacity .25s;z-index:7}#ov.show{opacity:1;pointer-events:auto}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background-size:cover;background-position:center;cursor:pointer}
#pf{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0006;z-index:9;padding:16px}
#pf .c{position:relative;background:var(--sf);border-radius:14px;width:100%;max-width:380px;overflow:hidden;border:1px solid var(--bd)}
.cv{height:110px;background-size:cover;background-position:center}
.pi{padding:0 16px 16px;margin-top:-40px;display:grid;gap:7px}
.pi .av{width:80px;height:80px;font-size:30px;border:3px solid var(--sf);cursor:default}
.wc{position:absolute;top:0;left:0;display:flex;direction:ltr;z-index:2}
.wc button{width:42px;height:32px;border-radius:0;background:#0007;color:#fff;padding:0;display:flex;align-items:center;justify-content:center}
.wc button:hover{background:#000b}.wc button.cl:hover{background:#e81123}
#side{position:fixed;top:0;left:0;bottom:0;width:310px;max-width:88%;background:var(--sf);border-right:1px solid var(--bd);overflow:auto;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));z-index:8;transform:translateX(-100%);transition:transform .25s}
#side.open{transform:none}#side input{margin-top:6px}
.nw{border:1px solid var(--bd);border-radius:10px;padding:9px;margin:8px 0;display:grid;gap:4px}
.mi{display:flex;gap:10px;align-items:center;width:100%;background:none;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:6px 0;text-align:start;font-size:15px}.mi:hover{background:var(--bg)}
.row2{display:flex;justify-content:space-between;gap:12px;font-size:13px}.row2 span:last-child{text-align:end}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin:6px -16px 0;padding:0 8px}
.tabs button{flex:1;background:none;color:var(--mu);border-radius:0;border-bottom:2px solid transparent;padding:9px 4px;font-size:13px}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:700}
.tb{max-height:46vh;overflow:auto;display:grid;gap:8px;padding-top:8px;align-content:start}
.gf{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.g1{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center;display:grid;gap:2px}.g1 .e{font-size:34px}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pg{height:6px;background:var(--bd);border-radius:4px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ac)}
.lvb{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:8px}
.lvb b{background:var(--ac);color:var(--ac2);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
textarea{resize:none}.row2 span:first-child{color:var(--mu)}
.u{padding:6px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:4px}.u:hover{background:var(--bg)}
#menu{position:fixed;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px;display:none;z-index:10;min-width:170px;box-shadow:0 6px 24px #0003}
#menu button{display:block;width:100%;text-align:start;background:none;color:var(--tx);padding:7px}#menu button:hover{background:var(--bg)}
.pn{position:fixed;inset-inline-start:10px;bottom:70px;width:290px;max-width:calc(100% - 20px);height:320px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;display:none;grid-template-rows:auto 1fr auto;z-index:4;box-shadow:0 6px 24px #0003}
.pn>div:first-child{padding:8px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between}
.pn .b{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:5px}.pn .bar{display:flex;gap:5px;padding:6px;border-top:1px solid var(--bd)}
#log{position:fixed;inset:8% 5%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;display:none;overflow:auto;z-index:6}
</style>
</head>
<body>
<div id="login"><div class="card">
<h1>شات عربي</h1><small>تسجيل الدخول عبر الخادم</small>
<input id="nick" placeholder="اسمك المستعار" maxlength="16">
<input id="pw" type="password" placeholder="كلمة المرور (8 أحرف فأكثر)" autocomplete="current-password">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
  <input id="age" type="number" min="18" max="99" placeholder="العمر (18+)">
  <select id="gen"><option>ذكر</option><option>أنثى</option></select>
  <input id="cty" placeholder="البلد" value="العراق">
  <select id="lng"><option>العربية</option><option>English</option></select>
</div>
<button id="go">دخول</button>
<button class="g" id="rg">تسجيل حساب جديد</button>
<button class="g" id="th">وضع ليلي / نهاري</button>
</div></div>

<div id="app">
<header>
<button class="g" id="bl" title="الإشعارات">🔔<span id="nc"></span></button>
<button class="g" id="pl" title="الخاص">✉️<span id="uc"></span></button>
<button class="g" id="rb"></button>
<select id="room" style="display:none"></select>
<span id="who" style="display:none"></span>
<span class="sp"></span>
<button class="g" id="mn" title="القائمة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="vertical-align:middle"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<main><section id="chat"><div id="pin"></div><div id="msgs"></div><div id="ty"></div><div id="rp"></div>
<div id="bar"><button class="g" id="ul" title="المتصلون">👥</button><button class="g" id="at" title="منشن">@</button><textarea id="txt" rows="1" placeholder="اكتب رسالتك..." maxlength="300"></textarea><button id="send">إرسال</button></div></section>
<aside id="users"></aside></main></div>

<div id="menu"></div><div id="ann"></div><button id="dn">⬇</button><div id="dl"></div><div id="wh"></div><div id="mp"></div><div id="ts"></div><div id="ov"></div><div id="side"></div><div id="pf"></div>
<div class="pn" id="pn"><div><b id="pt"></b><button class="g" id="px">×</button></div><div class="b" id="pb"></div><div class="bar"><input id="pi" placeholder="رسالة خاصة..."><button id="ps">إرسال</button></div></div>
<div id="log"><button class="g" id="lx">إغلاق</button><h3>سجل الأكشنز</h3><div id="lb"></div></div>

<script>
var RN={visitor:'زائر',member:'عضو',rankmod:'مشرف رتبي',roommod:'مشرف غرفة',genmod:'مشرف عام',super:'سوبر أدمن',programmer:'مبرمج',owner:'صاحب الموقع'};
var LV={visitor:0,member:1,rankmod:2,roommod:3,genmod:4,super:5,programmer:6,owner:7};
var ROOMS=['العامة','الخليج','مصر','المغرب العربي','الشباب','الثقافة والمنوعات'];
var CL=['#0f766e','#b45309','#7c3aed','#be123c','#1d4ed8','#4d7c0f'];
var users=[];
var me,room=ROOMS[0],ign={},fl=[],notes=[],unr={},fr={},sent={},reports=[],pins={},rmode={},mid=1,rp=null,hide=0,pm=null,logs=[],hist={},pms={},nid=100;
var $=function(i){return document.getElementById(i)};
var RK={90:'Operator',91:'Moderator',92:'Senior Moderator',93:'Supervisor',94:'Manager',95:'Senior Manager',96:'Director',97:'Chief',98:'Super Admin',99:'Super Admin',100:'Owner'};
var CAP={owner:100,programmer:90,genmod:40};
var RSV=/(admin|owner|moderator|operator|ادمن|أدمن|مشرف|صاحب|مبرمج|سوبر)/i;
function rname(r){return r>=90?RK[Math.min(r,100)]:r>0?'عضو '+r:'عضو'}
function eff(u){return u.role==='member'?(u.rank>=98?'super':u.rank>=90?'rankmod':'member'):u.role}
function lv(u){return LV[eff(u)]}
function pw(u){return lv(u)*100+(u.role==='member'?u.rank:0)}
function can(a,t,min){if(a.id===t.id)return false;if(a.role==='owner')return true;if(t.role==='owner')return false;if(lv(a)<6&&(!t.room||a.room!==t.room))return false;if(eff(a)==='roommod'&&a.mroom!==t.room)return false;return lv(a)>=min&&pw(a)>pw(t)}
function badge(u){return u.role==='member'?rname(u.rank):RN[u.role]}
function cap(a){return CAP[a.role]||0}
function canRank(a,t){return cap(a)>0&&t.role==='member'&&a.id!==t.id&&t.rank<=cap(a)}
function setRank(t,v){v=parseInt(v,10);if(!canRank(me,t)||!(v>=0&&v<=cap(me))){alert('الرتبة المسموح لك بها من 0 إلى '+cap(me));return}var o=t.rank;t.rank=v;if(v===o)return;addLog(me.name+' غيّر رتبة '+t.name+' من '+o+' إلى '+v);notify('rank',t.name+': '+rname(o)+' ← '+rname(v));post(room,0,t.name+': '+rname(o)+' ← '+rname(v)+' (بواسطة '+me.name+')',1);profile(t);drawUsers()}
var RC={owner:'#dc2626',programmer:'#7c3aed',super:'#be123c',rankmod:'#0f766e',genmod:'#1d4ed8',roommod:'#4d7c0f'};
var NI={friend:'👤',req:'🤝',warn:'⚠️',rank:'🏅',mention:'💬',pm:'✉️',like:'❤️',visit:'👁️',info:'📢'},EM=['👍','❤️','😂','😮','😢'];
function notify(ty,t,uid){notes.unshift({ty:ty,t:t,ts:Date.now(),r:0,uid:uid});nb();toast(NI[ty]+' '+t)}
function nb(){$('nc').textContent=notes.filter(function(x){return !x.r}).length||'';var p=0;for(var k in unr)p+=unr[k];$('uc').textContent=p||''}
function toast(t){var e=$('ts');e.textContent=t;e.style.display='block';clearTimeout(e.h);e.h=setTimeout(function(){e.style.display='none'},3000)}
function uname(i){var u=users.find(function(o){return o.id===i});return u?u.name:'؟'}
function report(t){reports.unshift({t:t,ts:Date.now(),d:0});addLog('🚩 '+t)}
function isMuted(u){if(u.muted&&u.mu&&Date.now()>u.mu)u.muted=false;return u.muted}
function clearRp(){rp=null;$('rp').style.display='none';$('pi').placeholder='رسالة خاصة...'}
function refresh(){var b=$('msgs'),t=b.scrollTop;draw();b.scrollTop=t;if(pm)drawPM()}
function react(m,k){m.rx=m.rx||{};var had=(m.rx[k]||[]).indexOf(me.id)>-1;for(var x in m.rx)m.rx[x]=m.rx[x].filter(function(i){return i!==me.id});if(!had)(m.rx[k]=m.rx[k]||[]).push(me.id);refresh()}
function announce(t,d){addLog(me.name+' أعلن ('+d+' ث): '+t);var a=$('ann');a.textContent='📣 '+t;a.classList.add('show');clearTimeout(a.h);a.h=setTimeout(function(){a.classList.remove('show')},d*1000)}
function drawPin(){var p=$('pin');p.textContent='';if(!pins[room])return;p.appendChild(el('span','','📌 '+pins[room]));if(lv(me)>=3){var x=el('button','g','×');x.onclick=function(){delete pins[room];drawPin()};p.appendChild(x)}}
function notesView(){var s=head('الإشعارات');if(!notes.length)s.appendChild(el('small','mu','لا توجد إشعارات.'));
notes.forEach(function(x){var c=el('div','nw');c.appendChild(el('div','',NI[x.ty]+' '+x.t));c.appendChild(el('small','mu',ago(x.ts)));
if(x.ty==='req'&&!x.done){var a=el('button','','قبول'),d=el('button','g','رفض');a.onclick=function(){x.done=1;fr[x.uid]=1;notify('friend','أصبحت صديقاً لـ '+uname(x.uid));notesView();drawUsers()};d.onclick=function(){x.done=1;notesView()};c.appendChild(a);c.appendChild(d)}
s.appendChild(c);x.r=1});nb()}
function pmView(){var s=head('الرسائل الخاصة');var ids=Object.keys(pms);if(!ids.length)s.appendChild(el('small','mu','لا توجد محادثات.'));ids.forEach(function(i){var u=users.find(function(o){return o.id==i});if(!u)return;var l=pms[i],b=el('button','mi');b.appendChild(el('span','',u.name+(unr[i]?' ('+unr[i]+')':'')));b.appendChild(el('small','mu',l.length?l[l.length-1].t.slice(0,25):''));b.onclick=function(){sdrawer(false);openPM(u)};s.appendChild(b)}
)}
function friendsView(){var s=head('الأصدقاء',1);var l=users.filter(function(u){return fr[u.id]});if(!l.length)s.appendChild(el('small','mu','لا أصدقاء بعد. اضغط على اسم مستخدم واختر «إضافة صديق».'));l.forEach(function(u){var c=el('div','nw');c.appendChild(el('b','',u.name+' · '+(u.room?'🟢 '+u.room:'⚪ غير متصل')));if(u.room){var g=el('button','g','انتقال لغرفته');g.onclick=function(){$('room').value=u.room;$('room').onchange();sdrawer(false)};c.appendChild(g)}s.appendChild(c)})}
var uq='';
function bn(u){return u.bu&&Date.now()<u.bu}
function canAnn(){return lv(me)>=4||(me.role==='member'&&me.rank>=90)}
function mention(u){var t=$('txt');t.value+=(t.value&&!/\s$/.test(t.value)?' ':'')+'@'+u.name+' ';t.focus()}
function showMP(){var p=$('mp');p.textContent='';var l=users.filter(function(u){return u.room===room&&u.id!==me.id&&!bn(u)});if(!l.length)p.appendChild(el('small','mu','لا أعضاء آخرون'));l.forEach(function(u){var b=el('button','g',u.name);b.style.cssText='display:block;width:100%;text-align:start;margin:2px 0';b.onclick=function(){mention(u);p.style.display='none'};p.appendChild(b)});p.style.display='block'}
function openWheel(){var w=$('wh');w.textContent='';var l=el('div');l.id='wl';ROOMS.forEach(function(r){var d=el('div','wi'+(r===room?' on':''),r+' ('+users.filter(function(u){return u.room===r}).length+')');d.onclick=function(){w.classList.remove('open');if(r!==room){$('room').value=r;$('room').onchange()}};l.appendChild(d)});w.appendChild(l);w.classList.add('open');l.scrollTop=l.querySelector('.on').offsetTop-66}
function visView(){var s=head('من زار بروفايلي',1);var l=me.vis||[];if(!l.length)s.appendChild(el('small','mu','لا زوار بعد.'));l.slice(0,30).forEach(function(v){var c=el('div','nw');c.appendChild(el('b','',v.n));c.appendChild(el('small','mu',ago(v.ts)));s.appendChild(c)})}
var PF={th:'auto',alt:1,bg:'none',fs:15},newc=0;try{Object.assign(PF,JSON.parse(localStorage.getItem('chatpf')||'{}'))}catch(e){}
function applyPf(){var d=document.documentElement;if(PF.th==='auto')d.removeAttribute('data-theme');else d.setAttribute('data-theme',PF.th);document.body.style.fontSize=PF.fs+'px';$('msgs').dataset.bg=PF.bg}
function setPref(k,v){PF[k]=v;try{localStorage.setItem('chatpf',JSON.stringify(PF))}catch(e){}applyPf();if(me)draw()}
function dn(){var b=$('msgs'),near=b.scrollHeight-b.scrollTop-b.clientHeight<80;if(near)newc=0;$('dn').style.display=near?'none':'block';$('dn').textContent='⬇'+(newc?' '+newc:'')}
function grow(){var t=$('txt');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,96)+'px'}
function addLog(t){logs.unshift(new Date().toLocaleTimeString('ar')+' — '+t);}
window.alert=function(t){toast('⚠️ '+t)};
function ask(title,fs,cb){var p=$('dl');p.textContent='';var c=el('div','c');c.style.cssText='padding:16px;display:grid;gap:8px';c.appendChild(el('b','',title));var ins={};
fs.forEach(function(f){c.appendChild(el('small','mu',f.l));var i=el('input');i.type=f.t||'text';if(f.t==='number'){i.min=f.min||0;if(f.max)i.max=f.max}i.value=f.v==null?'':f.v;ins[f.k]=i;c.appendChild(i)});
var er=el('small','');er.style.color='#dc2626';c.appendChild(er);var r=el('div','');r.style.cssText='display:flex;gap:8px';var ok=el('button','','تأكيد'),no=el('button','g','إلغاء');no.onclick=function(){p.style.display='none'};
ok.onclick=function(){var o={};for(var k in ins){var f=fs.filter(function(x){return x.k===k})[0],v=ins[k].value.trim();if(f.req!==false&&!v){er.textContent='الحقل مطلوب: '+f.l;return}
if(f.t==='number'){v=parseInt(v,10);if(isNaN(v)||v<(f.min||0)||(f.max&&v>f.max)){er.textContent='قيمة غير صحيحة: '+f.l;return}}o[k]=v}p.style.display='none';cb(o)};
r.appendChild(ok);r.appendChild(no);c.appendChild(r);p.appendChild(c);p.style.display='flex';ins[fs[0].k].focus()}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var IC={x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>',pm:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.2A8 8 0 1 1 21 12z"/></svg>'};
var NEWS=[{t:'غرفة جديدة',x:'تمت إضافة غرفة الثقافة والمنوعات.',d:Date.now()-5*36e5},{t:'قواعد جديدة',x:'يرجى احترام الجميع، والمخالفة تعرّضك للكتم أو الحظر.',d:Date.now()-864e5},{t:'افتتاح الموقع',x:'أهلاً بكم في النسخة التجريبية من شات عربي.',d:Date.now()-2*864e5}];
var curT=null;
function sdrawer(o){$('side').classList.toggle('open',o);ovl()}
function ovl(){$('ov').classList.toggle('show',$('users').classList.contains('open')||$('side').classList.contains('open'))}

var tx='✅ تم '+lb+' '+t.name+(o.d?' لمدة '+o.d+' دقيقة':' بشكل دائم')+' بسبب: '+o.r+' (بواسطة '+me.name+')';addLog(tx);post(rm,0,tx,1);drawUsers()})}
function menu(t,e){var m=$('menu');m.textContent='';if(t.id===me.id){m.style.display='none';profile(t);return}
function item(l,f){var b=el('button','',l);b.onclick=function(){m.style.display='none';f()};m.appendChild(b)}
item('عرض الملف الشخصي',function(){profile(t)});item('رسالة خاصة',function(){openPM(t)});
item(ign[t.id]?'إلغاء التجاهل':'تجاهل',function(){ign[t.id]=!ign[t.id];draw()});
item('تبليغ',function(){ask('تبليغ عن '+t.name,[{k:'r',l:'سبب البلاغ'}],function(o){report('بلاغ من '+me.name+' ضد '+t.name+': '+o.r);alert('تم إرسال البلاغ للإدارة')})});
if(fr[t.id])item('إزالة الصداقة',function(){delete fr[t.id];drawUsers()});else if(!sent[t.id]&&lv(me)>=1)item('إضافة صديق',function(){sent[t.id]=1;toast('تم إرسال طلب الصداقة');setTimeout(function(){if(sent[t.id]){fr[t.id]=1;delete sent[t.id];notify('friend',t.name+' قَبِل طلب صداقتك');drawUsers()}},4000)});
var n0=m.children.length;
if(can(me,t,2)&&!isMuted(t))item('كتم',function(){cmd('كتم',t,function(d){t.muted=true;t.mu=d?Date.now()+d*6e4:0})});
if(can(me,t,2)&&isMuted(t))item('فك الكتم',function(){t.muted=false;var tx='✅ تم فك كتم '+t.name+' بواسطة '+me.name;addLog(tx);post(t.room||room,0,tx,1);drawUsers()});
if(can(me,t,2))item('تحذير',function(){cmd('تحذير',t,function(d){t.warn=(t.warn||0)+1})});
if(can(me,t,3))item('طرد من الغرفة',function(){cmd('طرد',t,function(d){t.kb=d?Date.now()+d*6e4:0;t.room=ROOMS[(ROOMS.indexOf(t.room||room)+1)%6]})});
if(can(me,t,5))item('حظر',function(){cmd('حظر',t,function(d){t.bu=d?Date.now()+d*6e4:Infinity})});
if(can(me,t,5)&&LV[t.role]<=1)item('تعيين مشرف غرفة',function(){t.role='roommod';t.mroom=room;var tx='✅ تم تعيين '+t.name+' مشرف غرفة '+room+' بواسطة '+me.name;addLog(tx);post(room,0,tx,1);drawUsers()});
if(canRank(me,t))item('تغيير الرتبة',function(){profile(t)});
if(m.children.length===n0)m.appendChild(el('small','mu','الأوامر الإدارية غير متاحة: لا صلاحية، أو المستخدم ليس في غرفتك'));
m.style.display='block';m.style.top=Math.min(e.clientY,innerHeight-300)+'px';m.style.left=Math.min(e.clientX,innerWidth-190)+'px'}
function openPM(t){$('pf').style.display='none';if(lv(me)<1){alert('الزائر لا يستطيع إرسال رسائل خاصة. سجّل كعضو.');return}
pm=t;unr[t.id]=0;nb();pms[t.id]=pms[t.id]||[];$('pt').textContent='خاص مع '+t.name;$('pn').style.display='grid';drawPM()}
function drawPM(){var b=$('pb');b.textContent='';var pv=null;(pms[pm.id]||[]).forEach(function(m,i){b.appendChild(mkMsg(m,1,i,!!(pv&&pv.u===m.u)));pv=m});b.scrollTop=b.scrollHeight}
function sendPM(){var v=$('pi').value.trim();if(!v||!pm)return;var m={id:mid++,u:me,t:v,ts:Date.now(),rx:{}};if(rp&&rp.pm){m.q=rp;clearRp()}(pms[pm.id]=pms[pm.id]||[]).push(m);$('pi').value='';drawPM();var t=pm;
setTimeout(function(){if(!ign[t.id]&&pm===t)$('pt').textContent=t.name+' يكتب...'},500);
setTimeout(function(){if(ign[t.id])return;(pms[t.id]=pms[t.id]||[]).push({id:mid++,u:t,t:'أهلاً! هذا رد تلقائي من '+t.name,ts:Date.now(),rx:{}});if(pm===t){$('pt').textContent='خاص مع '+t.name;drawPM()}else{unr[t.id]=(unr[t.id]||0)+1;nb();notify('pm','رسالة جديدة من '+t.name)}},2000)}
function send(){var v=$('txt').value.trim();if(!v)return;if(isMuted(me)){post(room,0,'أنت مكتوم ولا تستطيع الكتابة',1);return}
var now=Date.now(),md=rmode[room];if(lv(me)<3){if(md==='للقراءة فقط'){post(room,0,'الغرفة للقراءة فقط حالياً',1);return}if(md==='بطيء'&&now-(me.lt||0)<1e4){post(room,0,'الوضع بطيء: رسالة كل 10 ثوانٍ',1);return}}
fl=fl.filter(function(x){return now-x<5000});if(fl.length>=4&&lv(me)<3){post(room,0,'أبطئ قليلاً، رسائلك كثيرة',1);return}fl.push(now);me.lt=now;$('txt').value='';grow();
var c=v.split(' ')[0];if(c==='/clear'){hist[room]=[];draw();return}
if(c==='/dice'){post(room,0,'🎲 '+me.name+' رمى النرد: '+(1+Math.floor(Math.random()*6)),1);return}
if(c==='/me'){post(room,0,'* '+me.name+' '+v.slice(4),1);return}
if(c==='/poll'&&lv(me)>=3){var p=v.slice(6).split('|').map(function(x){return x.trim()}).filter(Boolean);if(p.length<3){post(room,0,'الصيغة: /poll السؤال | خيار1 | خيار2',1);return}post(room,me,'📊 '+p[0],0,{poll:{o:p.slice(1,6).map(function(t){return{t:t,v:[]}})}});return}
post(room,me,v)}

/* ===== ربط الدخول بالسيرفر ===== */
(function(){
var lg=$('login');
lg.style.visibility='hidden';
var pw=$('pw');
function api(p,b){return fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})})}
function enter(u){
  me={id:u.id,name:u.name,role:u.role,rank:u.rank,room:room,muted:false,c:CL[0],join:u.created_at||Date.now(),age:u.age||20,gender:u.gender||'ذكر',country:u.country||'العراق',lang:u.lang||'العربية',msgs:0,gifts:[{e:'🌹',n:'وردة',from:'منى'}],conf:[]};
  if(u.room_mod_room)me.mroom=u.room_mod_room;
  users.push(me);
  lg.style.display='none';
  $('app').style.display='grid';
  $('room').innerHTML='';ROOMS.forEach(function(x){var o=document.createElement('option');o.textContent=x;$('room').appendChild(o)});
  $('who').textContent=me.name+' · '+badge(me);
  post(room,0,'مرحباً '+me.name+' في غرفة '+room,1);
  drawUsers();drawPin();$('rb').textContent=room+' ▾';
}
function auth(kind){
  var n=$('nick').value.trim(),p=pw.value;
  if(!n||!p){alert('اكتب الاسم وكلمة المرور');return}
  var b={name:n,password:p};
  if(kind==='register'){
    var ag=parseInt($('age').value,10);if(!(ag>=18)){alert('الموقع للبالغين فقط (18 سنة فما فوق)');$('age').focus();return}
    b.age=ag;b.gender=$('gen').value;b.country=$('cty').value.trim();b.lang=$('lng').value;
  }
  api(kind,b).then(function(r){
    if(r.s!==200){alert(r.j.error||'تعذر الإكمال');return}
    return api('me');
  }).then(function(r){
    if(r&&r.j&&r.j.user)enter(r.j.user);
  }).catch(function(){alert('تعذر الاتصال بالخادم')});
}
$('go').onclick=function(){auth('login')};
$('rg').onclick=function(){auth('register')};
pw.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing)auth('login')};

api('me').then(function(r){
  if(r.j&&r.j.user)enter(r.j.user);
  else lg.style.visibility='visible';
}).catch(function(){lg.style.visibility='visible'});
})();

$('room').onchange=function(){room=this.value;me.room=room;$('rb').textContent=room+' ▾';post(room,0,'دخلت غرفة '+room,1);draw();drawUsers()};
$('send').onclick=send;$('txt').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('txt').oninput=grow;
$('ps').onclick=sendPM;$('pi').onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing)sendPM()};$('px').onclick=function(){$('pn').style.display='none';pm=null};
$('lx').onclick=function(){$('log').style.display='none'};
$('ul').onclick=function(){sdrawer(false);drawer(true)};$('ov').onclick=function(){drawer(false);sdrawer(false)};$('mn').onclick=openMenu;
document.onkeydown=function(e){if(e.key==='Escape'){$('pf').style.display=$('pn').style.display=$('log').style.display=$('menu').style.display='none';pm=null;drawer(false);sdrawer(false)}};
$('bl').onclick=function(){drawer(false);notesView();sdrawer(true)};$('pl').onclick=function(){drawer(false);pmView();sdrawer(true)};
$('rb').onclick=function(e){e.stopPropagation();openWheel()};$('wh').onclick=function(e){e.stopPropagation()};$('at').onclick=function(e){e.stopPropagation();showMP()};$('mp').onclick=function(e){e.stopPropagation()};
$('th').onclick=function(){var dk=['dark','amoled','ocean','forest','sunset'];setPref('th',(dk.indexOf(PF.th)>-1||(PF.th==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches))?'light':'dark')};
$('msgs').onscroll=dn;$('dn').onclick=function(){var b=$('msgs');b.scrollTop=b.scrollHeight;newc=0;dn()};applyPf();
</script>
