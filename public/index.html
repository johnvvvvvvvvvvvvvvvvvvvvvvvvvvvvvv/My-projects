
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شات عربي</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ec;--sf:#fff;--tx:#1d2330;--mu:#566070;--ac:#0f766e;--ac2:#fff;--bd:#e2ddd5;--me:#d9f2ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--sf:#1a212b;--tx:#e8ecf2;--mu:#98a2b3;--ac:#2dd4bf;--ac2:#06201d;--bd:#2c3644;--me:#12413c}}
:root[data-theme="dark"]{--bg:#10151c;--sf:#1a212b;--tx:#e8ecf2;--mu:#98a2b3;--ac:#2dd4bf;--ac2:#06201d;--bd:#2c3644;--me:#12413c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{background:var(--ac);color:var(--ac2);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%;font-size:16px}
#login{display:flex;align-items:center;justify-content:center;min-height:100%;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:22px;width:100%;max-width:380px;display:grid;gap:10px}
h1{margin:0;font-size:22px;color:var(--ac)}small,.mu{color:var(--mu);font-size:12.5px}
#app{display:none;height:100%;grid-template-rows:auto 1fr}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header select{width:auto}header b{color:var(--ac)}.sp{flex:1}
main{display:grid;grid-template-columns:1fr;min-height:0}
#chat{display:grid;grid-template-rows:auto 1fr auto auto auto;min-height:0}
#msgs{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{background:var(--m1,var(--sf));border:1px solid var(--bd);border-radius:10px;padding:6px 10px;width:100%;word-break:break-word;display:flex;gap:8px;align-items:flex-start}
.m.me{background:var(--me);align-self:flex-start}.m.sys{display:block;text-align:center;align-self:center;background:none;border:0;color:var(--mu);font-size:12.5px}
.n{font-weight:700;font-size:13px}.bd{font-size:12px;border-radius:6px;padding:1px 6px;margin-inline-start:4px;background:var(--bd);color:var(--tx)}
#bar{display:flex;gap:6px;padding:8px;background:var(--sf);border-top:1px solid var(--bd)}
#bar input{flex:1}
aside{position:fixed;top:0;right:0;bottom:0;width:260px;max-width:85%;background:var(--sf);border-left:1px solid var(--bd);overflow:auto;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));z-index:8;transform:translateX(100%);transition:transform .25s}
aside.open{transform:none}
#ov{position:fixed;inset:0;background:#0005;opacity:0;pointer-events:none;transition:opacity .25s;z-index:7}#ov.show{opacity:1;pointer-events:auto}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background-size:cover;background-position:center;cursor:pointer}
#pf{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0006;z-index:9;padding:16px}
#pf .c{position:relative;background:var(--sf);border-radius:14px;width:100%;max-width:380px;overflow:hidden;border:1px solid var(--bd)}
.cv{height:110px;background-size:cover;background-position:center}
.pi{padding:0 16px 16px;margin-top:-40px;display:grid;gap:7px}
.pi .av{width:80px;height:80px;font-size:30px;border:3px solid var(--sf);cursor:default}
.wc{position:absolute;top:0;left:0;display:flex;direction:ltr;z-index:2}
.wc button{width:42px;height:32px;border-radius:0;background:#0007;color:#fff;padding:0;display:flex;align-items:center;justify-content:center}
.wc button:hover{background:#000b}.wc button.cl:hover{background:#e81123}
#side{position:fixed;top:0;left:0;bottom:0;width:310px;max-width:88%;background:var(--sf);border-right:1px solid var(--bd);overflow:auto;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));z-index:8;transform:translateX(-100%);transition:transform .25s}
#side.open{transform:none}#side input{margin-top:6px}
.nw{border:1px solid var(--bd);border-radius:10px;padding:9px;margin:8px 0;display:grid;gap:4px}
.mi{display:flex;gap:10px;align-items:center;width:100%;background:none;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:6px 0;text-align:start;font-size:15px}.mi:hover{background:var(--bg)}
.row2{display:flex;justify-content:space-between;gap:12px;font-size:13px}.row2 span:last-child{text-align:end}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin:6px -16px 0;padding:0 8px}
.tabs button{flex:1;background:none;color:var(--mu);border-radius:0;border-bottom:2px solid transparent;padding:9px 4px;font-size:13px}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:700}
.tb{max-height:46vh;overflow:auto;display:grid;gap:8px;padding-top:8px;align-content:start}
.gf{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.g1{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center;display:grid;gap:2px}.g1 .e{font-size:34px}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pg{height:6px;background:var(--bd);border-radius:4px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ac)}
.lvb{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:8px}
.lvb b{background:var(--ac);color:var(--ac2);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
textarea{resize:none}.row2 span:first-child{color:var(--mu)}
.u{padding:6px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:4px}.u:hover{background:var(--bg)}
#menu{position:fixed;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px;display:none;z-index:10;min-width:170px;box-shadow:0 6px 24px #0003}
#menu button{display:block;width:100%;text-align:start;background:none;color:var(--tx);padding:7px}#menu button:hover{background:var(--bg)}
.pn{position:fixed;inset-inline-start:10px;bottom:70px;width:290px;max-width:calc(100% - 20px);height:320px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;display:none;grid-template-rows:auto 1fr auto;z-index:4;box-shadow:0 6px 24px #0003}
.pn>div:first-child{padding:8px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between}
.pn .b{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:5px}.pn .bar{display:flex;gap:5px;padding:6px;border-top:1px solid var(--bd)}
#log{position:fixed;inset:8% 5%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;display:none;overflow:auto;z-index:6}
#pin{background:var(--me);padding:6px 10px;font-size:13px;border-bottom:1px solid var(--bd);display:flex;gap:8px;justify-content:space-between;align-items:center}#pin:empty{display:none}
#ty{font-size:12px;color:var(--mu);padding:0 12px}#rp{display:none;background:var(--bg);padding:4px 10px;font-size:12px;border-top:1px solid var(--bd);justify-content:space-between;align-items:center}
.q{border-inline-start:3px solid var(--ac);background:#0001;border-radius:6px;padding:3px 8px;font-size:12px;color:var(--mu);margin-bottom:3px;cursor:pointer}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.rx button{padding:1px 7px;font-size:12px;background:none;color:var(--tx);border:1px solid var(--bd)}.rx button.on{border-color:var(--ac)}
.m.mt{outline:2px solid var(--ac)}.m.fl{animation:fl 1.2s}@keyframes fl{from{background:#fde04777}}.tm{font-size:12px;color:var(--mu);margin-inline-start:6px}
#bl,#pl{position:relative}#nc,#uc{background:#dc2626;color:#fff;border-radius:9px;padding:0 5px;font-size:12px;margin-inline-start:3px}#nc:empty,#uc:empty{display:none}
#ts{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--ac);border-radius:10px;padding:8px 14px;z-index:20;display:none;box-shadow:0 6px 24px #0003;max-width:90%}
.m>div:not(.av){flex:1;min-width:0}.av{aspect-ratio:1}#dl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0006;z-index:40;padding:16px}#dl .c{background:var(--sf);border-radius:14px;width:100%;max-width:340px;border:1px solid var(--bd)}.m .n{cursor:pointer}
#ann{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;margin:0 auto;width:min(92vw,440px);display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-inline-start:4px solid var(--ac);border-radius:16px;box-shadow:0 12px 32px #0005;overflow:hidden;z-index:30;transform:translateY(-180%);transition:transform .55s cubic-bezier(.2,.9,.3,1.15);touch-action:pan-x;pointer-events:none}#ann.show{transform:none;pointer-events:auto}#ann .av{width:48px;height:48px;font-size:18px}#ann .at{flex:1;min-width:0}#ann .ah{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mu)}#ann .ah b{color:var(--ac)}#ann .atx{font-weight:700;margin-top:4px;word-break:break-word;line-height:1.5}#ann .ax{position:absolute;top:2px;left:4px;background:none;border:0;color:var(--mu);padding:2px 7px;font-size:15px}#ann .ap{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--ac);transform-origin:right;animation:annp linear forwards}@keyframes annp{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#wh{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);border-radius:16px 16px 0 0;z-index:12;padding:8px 0;transform:translateY(105%);transition:transform .25s;box-shadow:0 -6px 24px #0003}#wh.open{transform:none}
#wl{height:176px;overflow-y:auto;scroll-snap-type:y mandatory;padding:66px 0}.wi{height:44px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--mu);cursor:pointer}.wi.on{color:var(--ac);font-weight:700}
#mp{position:fixed;inset-inline-start:10px;bottom:64px;max-height:40vh;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px;display:none;z-index:6;min-width:160px}
:root[data-theme="light"],button[data-theme="light"]{--bg:#f4f1ec;--sf:#fff;--tx:#1d2330;--mu:#566070;--ac:#0f766e;--ac2:#fff;--bd:#e2ddd5;--me:#d9f2ee;--m1:#ffffff;--m2:#f5f1ea}
:root[data-theme="dark"],button[data-theme="dark"]{--bg:#10151c;--sf:#1a212b;--tx:#e8ecf2;--mu:#98a2b3;--ac:#2dd4bf;--ac2:#06201d;--bd:#2c3644;--me:#12413c;--m1:#161c25;--m2:#1d2530}
:root[data-theme="amoled"],button[data-theme="amoled"]{--bg:#000;--sf:#0b0b0b;--tx:#f2f2f2;--mu:#9a9a9a;--ac:#22d3ee;--ac2:#001417;--bd:#222;--me:#0b3a40;--m1:#0a0a0a;--m2:#141414}
:root[data-theme="ocean"],button[data-theme="ocean"]{--bg:#0b1b2b;--sf:#12283d;--tx:#e6f1fb;--mu:#8fb0cc;--ac:#38bdf8;--ac2:#04202f;--bd:#1f3d59;--me:#0e4a6b;--m1:#0f2236;--m2:#15304a}
:root[data-theme="forest"],button[data-theme="forest"]{--bg:#0f1a14;--sf:#17261d;--tx:#e7f3ea;--mu:#96b09f;--ac:#4ade80;--ac2:#052e16;--bd:#27402f;--me:#14532d;--m1:#13221a;--m2:#1a2e22}
:root[data-theme="sunset"],button[data-theme="sunset"]{--bg:#1e1424;--sf:#2a1b33;--tx:#fbeee6;--mu:#c4a5b5;--ac:#fb923c;--ac2:#2b1305;--bd:#46304f;--me:#6b2d3e;--m1:#25172d;--m2:#311f3b}
:root[data-theme="sand"],button[data-theme="sand"]{--bg:#efe6d8;--sf:#fbf6ec;--tx:#3b2f22;--mu:#8a7660;--ac:#b45309;--ac2:#fff;--bd:#dccdb4;--me:#f3d9b1;--m1:#fbf6ec;--m2:#f3ead9}
:root[data-theme="paper"],button[data-theme="paper"]{--bg:#eceff1;--sf:#fafafa;--tx:#263238;--mu:#78909c;--ac:#455a64;--ac2:#fff;--bd:#cfd8dc;--me:#dbe5ea;--m1:#f7f8f9;--m2:#eef1f3}
:root{--m1:#fff;--m2:#f5f1ea}@media(prefers-color-scheme:dark){:root:not([data-theme]){--m1:#161c25;--m2:#1d2530}}
.m.alt{background:var(--m2,var(--sf))}.m.gp{padding-top:2px;padding-bottom:2px}.m.gp>.av{height:1px;aspect-ratio:auto}.m.gp .n,.m.gp .bd{display:none}
.m.in{animation:inn .25s}@keyframes inn{from{opacity:0;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){.m.in{animation:none}}
#msgs:empty::before{content:'لا رسائل بعد، ابدأ المحادثة 👋';color:var(--mu);margin:auto}
#msgs[data-bg=dots]{background:radial-gradient(var(--bd) 1.2px,transparent 1.2px) 0 0/20px 20px,var(--bg)}
#msgs[data-bg=lines]{background:repeating-linear-gradient(45deg,transparent 0 14px,var(--bd) 14px 15px),var(--bg)}
#msgs[data-bg=grid]{background:linear-gradient(var(--bd) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--bd) 1px,transparent 1px) 0 0/24px 24px,var(--bg)}
#msgs[data-bg=soft]{background:linear-gradient(165deg,var(--bg),var(--me))}
#bar{align-items:flex-end}#bar textarea{flex:1;height:40px;max-height:96px;line-height:1.4}
#dn{position:fixed;bottom:78px;left:14px;display:none;z-index:5;background:var(--sf);color:var(--tx);border:1px solid var(--ac);border-radius:20px;box-shadow:0 4px 14px #0003}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style id="uxA">
body{font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif}
button{background:var(--tx);color:var(--bg);border-radius:10px;min-height:40px;padding:0 14px;font-weight:600;transition:transform .12s,opacity .12s,background .12s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.g{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);border:0}
button.g:hover{background:color-mix(in srgb,var(--ac) 20%,transparent);opacity:1}
button.dg,#menu button.dg{background:#dc262618;color:#dc2626}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{border-radius:10px}
header{padding:8px 12px;gap:6px}header>button{min-width:44px}
.card,#pf .c,#dl>.c{border-radius:16px}

</head>
<body>
<div id="login"><div class="card">
<h1>شات عربي</h1>
<div class="tabs" style="margin:0"><button class="on" id="t_in">دخول</button><button id="t_up">حساب جديد</button><button id="t_gu">زائر</button></div>
<input id="nick" placeholder="الاسم المستعار" maxlength="16" autocomplete="username">
<input id="pw" type="password" placeholder="كلمة المرور (8 أحرف+)" autocomplete="current-password">
<div id="lx2" style="display:none;grid-template-columns:1fr 1fr;gap:8px"><input id="age" type="number" min="18" max="99" placeholder="العمر (18+)"><select id="gen"><option>ذكر</option><option>أنثى</option></select><input id="cty" placeholder="البلد" value="العراق"><select id="lng"><option>العربية</option><option>English</option></select></div>
<label id="adl" style="display:none;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="adc" style="width:auto"> أؤكد أن عمري 18 سنة فما فوق</label>
<small id="lerr" style="color:#dc2626;min-height:16px"></small>
<button id="go">دخول</button><button class="g" id="th">وضع ليلي / نهاري</button>
</div></div>

<div id="app">
<header>
<button class="g" id="bl" title="الإشعارات">🔔<span id="nc"></span></button>
<button class="g" id="pl" title="الخاص">✉️<span id="uc"></span></button>
<button class="g" id="rb" title="الغرف">🏠</button>
<span id="rl" style="font-size:13px;color:var(--mu);margin-inline:6px"></span>
<select id="room" style="display:none"></select>
<span id="who" style="display:none"></span>
<span class="sp"></span>
<button class="g" id="mn" title="القائمة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="vertical-align:middle"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<main>
<section id="chat">
<div id="pin"></div>
<div id="msgs"></div>
<div id="ty"></div>
<div id="rp"></div>
<div id="bar">
<button class="g" id="ul" title="المتصلون">👥</button>
<button class="g" id="at" title="منشن">@</button>
<textarea id="txt" rows="1" placeholder="اكتب رسالتك..." maxlength="300"></textarea>
<button id="send">إرسال</button>
</div>
</section>
<aside id="users"></aside>
</main>
</div>

<div id="menu"></div>
<div id="ann"></div>
<button id="dn" title="إلى آخر رسالة">⬇</button>
<div id="dl"></div>
<div id="wh"></div>
<div id="mp"></div>
<div id="ts"></div>
<div id="ov"></div>
<div id="side"></div>
<div id="pf"></div>
<div class="pn" id="pn"><div><b id="pt"></b><button class="g" id="px" title="إغلاق">×</button></div><div class="b" id="pb"></div><div class="bar"><input id="pi" placeholder="رسالة خاصة..."><button id="ps">إرسال</button></div></div>
<div id="log"><button class="g" id="lx">إغلاق</button><h3>سجل الأكشنز</h3><div id="lb"></div></div>

<script>
/* ============================================================
   الثوابت والحالة العامة
   ============================================================ */
var RN = {visitor:'زائر',member:'عضو',rankmod:'مشرف رتبي',roommod:'مشرف غرفة',genmod:'مشرف عام',super:'سوبر أدمن',programmer:'مبرمج',owner:'صاحب الموقع'};
var LV = {visitor:0,member:1,rankmod:2,roommod:3,genmod:4,super:5,programmer:6,owner:7};
var ROOMS = ['العامة','الخليج','مصر','المغرب العربي','الشباب','الثقافة والمنوعات'];
var CL = ['#0f766e','#b45309','#7c3aed','#be123c','#1d4ed8','#4d7c0f'];
var RK = {90:'Operator',91:'Moderator',92:'Senior Moderator',93:'Supervisor',94:'Manager',95:'Senior Manager',96:'Director',97:'Chief',98:'Super Admin',99:'Super Admin',100:'Owner'};
var CAP = {owner:100,programmer:90,super:40,genmod:20};
var RSV = /(admin|owner|moderator|operator|ادمن|أدمن|مشرف|صاحب|مبرمج|سوبر)/i;
var EM = ['👍','❤️','😂','😮','😢'];
var GIFTS = [['🌹','وردة'],['🏆','كأس'],['💎','ألماس'],['🎂','كعكة'],['☕','قهوة'],['🧸','دبدوب'],['👑','تاج'],['⭐','نجمة']];
var NI = {friend:'👤',req:'🤝',warn:'⚠️',rank:'🏅',mention:'💬',pm:'✉️',like:'❤️',gift:'🎁',visit:'👁️',info:'📢'};
var RC = {owner:'#dc2626',programmer:'#7c3aed',super:'#be123c',rankmod:'#0f766e',genmod:'#1d4ed8',roommod:'#4d7c0f'};
var BI = {owner:'👑 ',programmer:'</> ',super:'🛡✓ ',rankmod:'🛡 ',genmod:'🛡 ',roommod:'🛡 '};

/* الحالة */

var $ = function(i){ return document.getElementById(i); };
function el(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }
function toast(t){ var e=$('ts'); e.textContent=t; e.style.display='block'; clearTimeout(e.h); e.h=setTimeout(function(){ e.style.display='none'; },3000); }

function z(n){ return (n<10?'0':'')+n; }
function fdate(t){ var d=new Date(t); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function fdt(t){ var d=new Date(t); return fdate(t)+' '+z(d.getHours())+':'+z(d.getMinutes()); }
function num(n){ return Number(n||0).toLocaleString('en-US'); }
function ago(t){ if(!t) return '—'; var m=Math.round((Date.now()-t)/6e4); return m<1?'الآن':m<60?'منذ '+m+' دقيقة':m<1440?'منذ '+Math.round(m/60)+' ساعة':'منذ '+Math.round(m/1440)+' يوم'; }
function uname(i){ var u=users.find(function(o){ return o.id===i; }); return u?u.name:'؟'; }
function fmtD(d){ return d>=1440?Math.round(d/1440)+' يوم':d>=60?Math.round(d/60)+' ساعة':d+' دقيقة'; }
function until(d){ return d?Date.now()+d*6e4:Infinity; }
function on(x){ return x&&Date.now()<x; }

/* الصلاحيات */
function _eff(u){ return u.role==='member'?(u.rank>=98?'super':u.rank>=91?'genmod':u.rank>=90?'rankmod':'member'):u.role; }
function susp(u){ var q=u.susp; if(!q) return null; if(Date.now()>=q.until){ u.susp=null; return null; } return q; }
function eff(u){ return susp(u)?'member':_eff(u); }
function lv(u){ return Math.max(LV[eff(u)], isRM(u)?3:0); }
function pw(u){ return lv(u)*100+(u.role==='member'?u.rank:0); }
function isRM(u){ return !!u.mroom&&u.role==='member'&&!susp(u); }
function rmOnly(u){ return isRM(u)&&LV[eff(u)]<2; }
function ckey(u){ var e=eff(u); return LV[e]>=2?e:(isRM(u)?'roommod':e); }
function cap(a){ return CAP[eff(a)]||0; }
function can(a,t,min){
  if(a.id===t.id) return false;
  if(a.role==='owner') return true;
  if(t.role==='owner') return false;
  if(LV[eff(a)]<2&&(!t.room||a.room!==t.room)) return false;
  if(rmOnly(a)&&a.mroom!==t.room) return false;
  return lv(a)>=min&&pw(a)>pw(t);
}
function canRank(a,t){ return cap(a)>0&&t.role==='member'&&a.id!==t.id&&t.rank<=cap(a); }
function badge(u){
  var m=u.role==='member', x=m?rname(u.rank):RN[u.role], e=_eff(u), t=[];
  if(m&&e==='genmod') t.push(RN.genmod);
  if(m&&u.mroom) t.push(RN.roommod+' '+u.mroom);
  return (BI[e]||(m&&u.mroom?BI.roommod:''))+x+(t.length?' · '+t.join(' · '):'')+(susp(u)?' (موقوف)':'');
}
function rname(r){ return r>=90?RK[Math.min(r,100)]:r>0?'عضو '+r:'عضو'; }

function api(p,b){
  return fetch('/api/'+p,{
    method:b?'POST':'GET',
    credentials:'same-origin',
    headers:b?{'content-type':'application/json'}:{},
    body:b?JSON.stringify(b):undefined
  }).then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j}; },function(){ return {s:r.status,j:{}}; }); });
}
function soc(path,body,cb){
  NET.pend++;
  api(path,body).then(function(r){ NET.pend--; cb(r); },function(){ NET.pend--; cb({s:0,j:{error:'تعذر الاتصال بالخادم'}}); });
}

function drawUsers(){
  var a=$('users'); a.textContent='';
  var h=el('div','u'); h.style.cursor='default';
  h.appendChild(el('b','','المتصلون في '+room));
  var x=el('button','g','×'); x.onclick=function(){ drawer(false); }; h.appendChild(x);
  a.appendChild(h);
  var i=el('input'); i.placeholder='ابحث عن شخص...'; i.value=uq;
  i.oninput=function(){ uq=this.value; fillU(); };
  a.appendChild(i);
  var l=el('div'); l.id='uls'; a.appendChild(l);
  fillU();
}
var uq='';
function urow(u,sr){
  var d=el('div','u');
  var n=el('span','',u.name+(fr[u.id]?' 👥':'')+(isMuted(u)?' 🔇':''));
  n.style.color=u.c;
  d.appendChild(n);
  d.appendChild(el('small','mu',badge(u)+(sr?' · '+(u.room||'غير متصل'):'')));
  d.onclick=function(e){ e.stopPropagation(); menu(u,e); };
  return d;
}
function fillU(){
  var l=$('uls'); if(!l) return; l.textContent='';
  var q=uq.trim().toLowerCase();
  if(q){
    users.filter(function(u){ return !bn(u)&&u.name.toLowerCase().indexOf(q)>-1; })
      .sort(function(x,y){ var a=x.name.toLowerCase().indexOf(q)?1:0,b=y.name.toLowerCase().indexOf(q)?1:0; return a-b||pw(y)-pw(x); })
      .forEach(function(u){ l.appendChild(urow(u,1)); });
    if(!l.children.length) l.appendChild(el('small','mu','لا نتائج'));
    return;
  }
  users.filter(function(u){ return u.room===room&&!bn(u); })
    .sort(function(x,y){ return pw(y)-pw(x); })
    .forEach(function(u){ l.appendChild(urow(u)); });
  var off=users.filter(function(u){ return !u.room&&!bn(u); });
  if(off.length){
    l.appendChild(el('small','mu','غير متصلين'));
    off.forEach(function(u){ l.appendChild(urow(u)); });
  }
}
function bn(u){ return u.bu&&Date.now()<u.bu; }
function isMuted(u){ if(u.muted&&u.mu&&Date.now()>u.mu) u.muted=false; return u.muted; }

function drawPin(){

  if(!pins[room]) return;
  p.appendChild(el('span','','📌 '+pins[room]));
  if(lv(me)>=3){
    var x=el('button','g','×');
    x.onclick=function(){
      var rm=room;
      soc('pin/clear',{room:rm},function(r){
        if(r.j&&r.j.ok){ delete pins[rm]; if(rm===room) drawPin(); }
        else toast('⚠️ '+((r.j&&r.j.error)||'تعذر إلغاء التثبيت'));
      });
    };

var ANN = {last:0};
function applyAnn(a, now){
  if(!a||!me||a.id<=ANN.last) return;
  ANN.last=a.id;
  if(ST.nt.info===0) return;
  var rem=a.ts+a.dur*1000-(now||Date.now());
  if(rem<1500) return;
  showAnn(a,rem);
}
function showAnn(a,rem){
  var d=$('ann'); d.textContent='';
  var u=mkUser({id:a.by,name:a.name,role:a.role,rank:a.rank,iv:a.iv||0});
  var t=el('div','at'), hd=el('div','ah');
  hd.appendChild(el('b','','📣 '+(a.name||'إعلان')));
  hd.appendChild(el('span','bd',badge(u)));
  t.appendChild(hd);
  t.appendChild(el('div','atx',a.text));
  var x=el('button','ax','✕');
  x.onclick=function(){ d.classList.remove('show'); };
  var p=el('div','ap'); p.style.animationDuration=rem+'ms';
  d.appendChild(av(u));
  d.appendChild(t);
  d.appendChild(x);
  d.appendChild(p);
  d.classList.remove('show');
  void d.offsetWidth;
  d.classList.add('show');
  clearTimeout(d.h);
  d.h=setTimeout(function(){ d.classList.remove('show'); },rem);
}
function announce(t,d){
  soc('announce',{text:String(t||''),dur:d},function(r){
    if(!(r.j&&r.j.ok)){ toast('⚠️ '+((r.j&&r.j.error)||'تعذر إرسال الإعلان')); return; }
    var a=r.j.ann;
    if(a.id>ANN.last) ANN.last=a.id;
    showAnn(a,a.dur*1000);
  });
}

   عرض الرسائل
   ============================================================ */
function mkMsg(m, isPM, ix, grp){
  var mt = m.u && m.u!==me && !m.s && m.t && m.t.indexOf('@'+me.name)>-1;
  var d = el('div','m'
    +(m.s?' sys':m.u&&m.u.id===me.id?' me':'')
    +(mt?' mt':'')
    +(PF.alt&&ix%2&&!m.s&&!(m.u&&m.u.id===me.id)?' alt':'')
    +(grp?' gp':''));
  d.id='m'+m.id;
  if(m.s){ d.textContent=m.t; return d; }
  if(m.u && RC[ckey(m.u)]) d.style.borderInlineStart='3px solid '+RC[ckey(m.u)];
  if(grp){ var sp=el('div','av'); sp.style.visibility='hidden'; d.appendChild(sp); }
  else d.appendChild(av(m.u));
  var w=el('div');
  var n=el('span','n',m.u.name);
  n.style.color=m.u.c;
  n.onclick=function(e){ e.stopPropagation(); if(!isPM) mention(m.u); };
  w.appendChild(n);
  var b=el('span','bd',badge(m.u));
  if(m.u && RC[ckey(m.u)]){ b.style.background=RC[ckey(m.u)]; b.style.color='#fff'; }
  w.appendChild(b);
  var tm=new Date(m.ts);
  w.appendChild(el('span','tm',z(tm.getHours())+':'+z(tm.getMinutes())+(m.ed?' (معدّلة)':'')));
  if(m.q){
    var q=el('div','q',m.q.n+': '+m.q.t);
    q.onclick=function(e){
      e.stopPropagation();
      var t=$('m'+m.q.id);
      if(t){ t.scrollIntoView({block:'center'}); t.classList.add('fl'); setTimeout(function(){ t.classList.remove('fl'); },1300); }
    };
    w.appendChild(q);
  }
  w.appendChild(el('div','',m.t));
  if(m.o && lv(me)>=5) w.appendChild(el('small','mu','الأصل: '+m.o));
  if(m.poll && m.sid){
    m.poll.o.forEach(function(o,oi){
      var pb=el('button',o.v.indexOf(me.id)>-1?'':'g',o.t+' ('+o.v.length+')');
      pb.style.margin='3px 3px 0 0';
      pb.onclick=function(e){
        e.stopPropagation();
        soc('msg/vote',{id:m.sid,opt:oi},function(r){
          if(r.j&&r.j.ok){
            m.poll.o.forEach(function(x){ x.v=x.v.filter(function(k){ return k!==me.id; }); });
            o.v.push(me.id);
          } else toast('⚠️ '+((r.j&&r.j.error)||'تعذر التصويت'));
          refresh();
        });
      };
      w.appendChild(pb);
    });
  }
  var rk=Object.keys(m.rx||{}).filter(function(k){ return m.rx[k].length; });
  if(rk.length){
    var rx=el('div','rx');
    rk.forEach(function(k){
      var rb=el('button',m.rx[k].indexOf(me.id)>-1?'on':'',k+' '+m.rx[k].length);
      rb.onclick=function(e){ e.stopPropagation(); react(m,k); };
      rx.appendChild(rb);
    });
    w.appendChild(rx);
  }
  d.appendChild(w);
  if(m.u && m.u!==me){
    var mo=el('button','g','⋯');
    mo.title='خيارات';
    mo.style.cssText='padding:0 9px;align-self:flex-start';
    mo.onclick=function(e){ e.stopPropagation(); menu(m.u,e); };
    d.appendChild(mo);
  }
  if(!m.del) d.onclick=function(e){ e.stopPropagation(); msgMenu(m,e,isPM); };
  return d;
}

function draw(){
  var b=$('msgs'); b.textContent='';
  var pv=null, k=0;
  (hist[room]||[]).forEach(function(m){
    if(!shown(m)) return;
    b.appendChild(mkMsg(m,0,k++,!!(pv&&!pv.s&&!m.s&&pv.u===m.u)));
    pv=m;
  });
  b.scrollTop=b.scrollHeight;
  newc=0;
  dn();
  drawPin();
}
function refresh(){ var b=$('msgs'), t=b.scrollTop; draw(); b.scrollTop=t; if(pm) drawPM(); }
function shown(m){
  if(m.u && m.u!==me && ign[m.u.id]) return false;
  if(m.u && m.u!==me && on(m.u.sh) && lv(me)<1) return false;
  return true;
}

function post(r,u,text,sys,ex){
  var a=hist[r]=hist[r]||[];
  var m={id:mid++,u:u,t:text,s:sys,ts:Date.now(),rx:{}};
  if(ex) for(var k in ex) m[k]=ex[k];
  if(u===me && rp && !rp.pm && !(ex&&ex.sid)){ m.q=rp; clearRp(); }
  var pv=a[a.length-1];
  a.push(m);
  if(a.length>200) a.shift();
  if(u && !sys){
    u.msgs=(u.msgs||0)+1;
    if(me && u!==me && !(ex&&ex.old) && text && text.indexOf('@'+me.name)>-1)
      notify('mention',u.name+' ذكرك في غرفة '+r);
  }
  if(r!==room || !shown(m)) return m;
  var b=$('msgs'), near=b.scrollHeight-b.scrollTop-b.clientHeight<80 || u===me;
  var x=mkMsg(m,0,b.children.length,!!(pv&&!pv.s&&!m.s&&pv.u===u));
  x.classList.add('in');
  b.appendChild(x);
  while(b.children.length>200) b.removeChild(b.firstChild);
  if(near) b.scrollTop=b.scrollHeight;
  else { newc++; dn(); }
  return m;
}

function dn(){
  var b=$('msgs'), near=b.scrollHeight-b.scrollTop-b.clientHeight<80;
  if(near) newc=0;
  $('dn').style.display=near?'none':'block';
  $('dn').textContent='⬇'+(newc?' '+newc:'');
}

function react(m,k){
  if(!m.sid){ toast('⏳ انتظر اكتمال الإرسال'); return; }
  var had=((m.rx||{})[k]||[]).indexOf(me.id)>-1;
  soc('msg/react',{scope:m.pm?'p':'r',id:m.sid,e:k},function(r){
    if(r.j&&r.j.ok){
      m.rx=m.rx||{};
      for(var x in m.rx) m.rx[x]=m.rx[x].filter(function(i){ return i!==me.id; });
      if(!had) (m.rx[k]=m.rx[k]||[]).push(me.id);
    } else toast('⚠️ '+((r.j&&r.j.error)||'تعذر التفاعل'));
    refresh();
  });
}

function msgMenu(m,e,isPM){
  var mn=$('menu'); mn.textContent='';
  var r=el('div','pk');
  EM.forEach(function(k){
    var b=el('button','g',k);
    b.onclick=function(){ mn.style.display='none'; react(m,k); };
    r.appendChild(b);
  });
  mn.appendChild(r);
  function it(l,f){ var b=el('button','',l); b.onclick=function(){ mn.style.display='none'; f(); }; mn.appendChild(b); }
  it('↩️ رد',function(){
    rp={n:m.u.name,t:(m.t||'').slice(0,60),id:m.id,pm:!!isPM};
    if(isPM){ $('pi').placeholder='↩️ رد على '+m.u.name; $('pi').focus(); }
    else {
      var p=$('rp'); p.style.display='flex'; p.textContent='';

function setSt(m,r){

function doAct(a,t){
  if(!a||!t) return;
  if(a.v){ a.v(t); return; }
  var fs=[{k:'r',l:'السبب'}];
  if(a.d) fs.push({k:'d',l:'المدة بالدقائق (0 = دائم)',t:'number',v:10});

    var d=a.d?parseInt(o.d||0,10):0;
    var body={target:t.id,reason:String(o.r||'').slice(0,200)};
    if(a.d) body.minutes=d;
    soc('mod/'+a.path,body,function(r){
      if(!(r.j&&r.j.ok)){ toast('⚠️ '+((r.j&&r.j.error)||'تعذر')); return; }
      var tx='✅ '+a.l+' '+t.name+(a.d?' ('+(d?'لمدة '+d+' دقيقة':'دائم')+')':'')+(o.r?' — '+o.r:'')+' بواسطة '+me.name;

function pick(u,k){
  if(u!==me) return;
  if(lv(me)<1){ toast('الصورة للأعضاء فقط'); return; }
  var f=document.createElement('input'); f.type='file'; f.accept='image/*';
  f.onchange=function(){
    var x=f.files[0]; if(!x) return;
    if(x.size>8e6){ toast('الصورة كبيرة (8 ميجا)'); return; }
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onerror=function(){ toast('⚠️ تعذر قراءة الصورة'); };
      im.onload=function(){
        var w=k==='img'?256:960, h=k==='img'?256:360, mx=k==='img'?85000:250000;
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        var g=c.getContext('2d');
        g.fillStyle='#fff'; g.fillRect(0,0,w,h);
        var sc=Math.max(w/im.width,h/im.height), sw=w/sc, sh=h/sc;
        g.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,w,h);
        var q=.85, d=c.toDataURL('image/jpeg',q);
        while(d.length>mx && q>.4){ q-=.1; d=c.toDataURL('image/jpeg',q); }
        if(d.length>mx){ toast('⚠️ الصورة معقدة'); return; }
        var b={}; b[k]=d; saveProf(u,b);
      };
      im.src=r.result;
    };
    r.readAsDataURL(x);
  };
  f.click();
}

      l.forEach(function(x){ if(x.q && x.q.id===r.id){ x.q=null; ch=1; } });
      return;
    }
    var m = l.find(function(x){ return x.sid===r.id; });
    if(m){ setSt(m, r); ch = 1; }
  });
  if(ch && rm===room) refresh();
}

function applyUpdPM(rows){
  if(!rows || !rows.length) return;
  var ch = 0;
  function f(l){
    (l||[]).forEach(function(m){
      if(!m.sid) return;
      var r = rows.find(function(x){ return x.id===m.sid; });
      if(r){ setSt(m, r); ch = 1; }
    });
  }
  for(var k in pms) f(pms[k]);
  for(var q in REQ) f(REQ[q]);
  if(ch){ if(pm) drawPM(); nb(); }
}

function applyPM(d){
  if(!d || !me) return;
  var first = PN.first;
  (d.peers||[]).forEach(function(o){ mkUser(o); });
  if(first && d.unread){
    for(var k in d.unread) if(!ign[k]) unr[k] = d.unread[k];
  }
  var open = 0;
  (d.rows||[]).forEach(function(r){
    if(r.id > PN.pa) PN.pa = r.id;
    if(PN.seen[r.id]) return;
    PN.seen[r.id] = 1;
    var mine = r.from_id === me.id;
    var pid = mine ? r.to_id : r.from_id;
    var p = users.find(function(x){ return x.id===pid; });
    if(!p) return;
    if(!mine && (ign[pid] || ST.pm==='none' || (ST.pm==='friends' && !fr[pid]))) return;
    var m = {id:mid++, u:mine?me:p, t:r.text, ts:r.ts, rx:r.rx||{}, sid:r.id, pm:1};
    if(r.rt) m.q = {n:r.rn, t:r.rt, id:r.rid, pm:true};
    if(r.exp) m.exp = r.exp;
    if(r.ed) m.ed = 1;
    if(r.o) m.o = r.o;
    if(r.del){ m.t='🚫 تم حذف الرسالة'; m.del=1; m.rx={}; }
    if(!mine && !pms[pid] && !fr[pid] && ST.rq){
      (REQ[pid] = REQ[pid]||[]).push(m);
      if(!first) notify('pm','📩 طلب مراسلة من '+p.name);
      return;
    }
    (pms[pid] = pms[pid]||[]).push(m);
    if(!mine && !first && !r.del){
      if(pm && pm.id===pid) open = pid;
      else { unr[pid]=(unr[pid]||0)+1; notify('pm','رسالة جديدة من '+p.name); }
    }
  });
  PN.first = 0;
  applyUpdPM(d.upd);
  nb();
  if(open){ drawPM(); api('pm/read',{peer:open}); }
}

function applySoc(d){
  if(!d || !me) return;
  var first = SOC.first;
  (d.friends||[]).forEach(function(o){ mkUser(o); });
  var nf = {}; (d.friends||[]).forEach(function(o){ nf[o.id]=1; }); fr = nf;
  var ns = {}; (d.sent||[]).forEach(function(id){ ns[id]=1; }); sent = ns;

function applySx(sx){
  if(!sx) return;
  var mm={}, rv={}, sh={}, np={}, sl={};
  sx.forEach(function(x){
    if(x.k==='mute') mm[x.id] = x;
    else if(x.k==='shadow') sh[x.id] = x;
    else if(x.k==='nopm') np[x.id] = x;
    else if(x.k==='slow') sl[x.id] = x;
    else rv[x.id] = x;
  });
  users.forEach(function(u){
    var a = mm[u.id], b = rv[u.id];
    u.muted = !!a;
    u.mu = a && a.until ? a.until : 0;
    u.susp = b ? {by:b.by, byName:b.byName, reason:b.reason, until:b.until?b.until:Infinity, bp:b.bp} : null;
    u.sh = sh[u.id] ? (sh[u.id].until||Infinity) : 0;
    u.np = np[u.id] ? (np[u.id].until||Infinity) : 0;
    u.sl = sl[u.id] ? (sl[u.id].until||Infinity) : 0;
  });
  drawUsers();
}

function igKey(){ return Object.keys(ign).filter(function(k){ return ign[k]; }).sort().join(','); }

function syncSoc(){
  if(!me) return;
  if(IG.loaded && !IG.busy){
    var k = igKey();
    if(k !== IG.sig){
      IG.busy = 1;
      var nw = k ? k.split(',').map(Number) : [];
      api('ignore/set',{ids:nw}).then(function(r){
        IG.busy = 0;
        if(r.j && r.j.ok) IG.sig = k;
      },function(){ IG.busy = 0; });
    }
  }
  if(PR.loaded && !PR.busy && ST.pm !== PR.sig){
    PR.busy = 1;
    var v = ST.pm;
    api('prefs/set',{pm:v}).then(function(r){
      PR.busy = 0;
      if(r.j && r.j.ok) PR.sig = v;
    },function(){ PR.busy = 0; });
  }
}

   دورة الاستطلاع
   ============================================================ */
function poll(){
  if(!me) return schedule();
  if(NET.busy || NET.pend>0) return schedule();
  NET.busy = 1;
  var g = NET.gen, rm = room;
  var hb = Date.now()-NET.hb > 20000;
  var qs = 'room='+encodeURIComponent(rm)
    +'&after='+NET.last
    +'&ut='+NET.ut
    +(hb?'&hb=1':'')
    +'&pa='+PN.pa
    +(PN.first?'&pf=1':'')
    +'&pu='+PN.ut
    +'&na='+SOC.na
    +(SOC.first?'&sf=1':'')
    +'&an='+ANN.last;
  api('poll?'+qs).then(function(r){
    if(g !== NET.gen) return;
    NET.busy = 0;
    if(rm !== room || NET.pend>0) return;
    if(r.s === 401){ toast('⚠️ '+((r.j&&r.j.error)||'انتهت الجلسة')); return; }
    if(r.s === 403 && r.j && r.j.kicked){
      toast('🚪 '+r.j.error);
      $('room').value = ROOMS[(ROOMS.indexOf(rm)+1)%ROOMS.length];
      $('room').onchange();
      return;
    }
    if(r.j && r.j.move && r.j.move !== rm && ROOMS.indexOf(r.j.move) > -1){
      toast('🔀 نُقلت إلى '+r.j.move);
      $('room').value = r.j.move;
      $('room').onchange();
      return;
    }
    if(!r.j || !r.j.msgs) return;
    if(r.j.mute !== undefined){
      me.muted = !!r.j.mute;
      me.mu = r.j.mute && r.j.mute.until ? r.j.mute.until : 0;
    }
    if(hb) NET.hb = Date.now();
    applyOnline(r.j.online||[]);
    applySoc(r.j.soc);
    applySx(r.j.sx);
    applyAnn(r.j.ann, r.j.now);
    if(r.j.warns !== undefined) me.warn = r.j.warns;
    if(!EMG){
      var rl6 = {slow:'بطيء', ro:'للقراءة فقط'}[r.j.rmode];
      if(rl6) rmode[rm] = rl6;
      else delete rmode[rm];
    }
    if(NET.first){
      NET.first = 0;
      hist[rm] = [];
      draw();
      addRows(r.j.msgs, 1);
      if(NET.sys){ post(rm, 0, NET.sys, 1); NET.sys = null; }
    } else {
      addRows(r.j.msgs, 0);
    }
    applyUpd(r.j.upd, rm);
    if(r.j.pin !== undefined){
      var op = pins[rm] || null;
      if(r.j.pin) pins[rm] = r.j.pin;
      else delete pins[rm];
      if(rm===room && op !== (r.j.pin||null)) drawPin();
    }
    if(r.j.now){
      NET.ut = Math.max(1, r.j.now - 1500);
      PN.ut = NET.ut;
    }
    applyPM(r.j.pm);
  },function(){ if(g===NET.gen) NET.busy = 0; })
  .then(schedule);
}

function schedule(){
  clearTimeout(NET.t);
  syncSoc();
  NET.t = setTimeout(poll, document.hidden ? 20000 : 4000);
}
function pollNow(){ clearTimeout(NET.t); poll(); }
function startNet(){ if(NET.on) return; NET.on = 1; netReset(); pollNow(); }

document.addEventListener('visibilitychange',function(){
  if(!document.hidden && NET.on && me) pollNow();
});

function rsend(v){
  if(v.length > 500){ toast('⚠️ طويلة'); $('txt').value=v; return; }
  var rm = room, m = post(rm, me, v);
  if(!m) return;
  var q = m.q ? {id:m.q.id, n:m.q.n, t:m.q.t} : null;
  NET.pend++;
  function fail(msg){
    NET.pend--;
    hist[rm] = (hist[rm]||[]).filter(function(x){ return x!==m; });
    if(rm===room) draw();
    toast('⚠️ '+msg);
  }
  api('post',{room:rm, text:m.t, reply:q}).then(function(r){
    if(r.j && r.j.ok){ NET.pend--; m.sid = r.j.id; NET.seen[r.j.id] = 1; }
    else fail((r.j&&r.j.error)||'تعذر الإرسال');
  },function(){ fail('تعذر الاتصال'); });
}

function rcmd(v){
  soc('post',{room:room, text:v},function(r){
    if(r.j && r.j.ok) pollNow();
    else toast('⚠️ '+((r.j&&r.j.error)||'تعذر'));
  });
}

function send(){
  var v = $('txt').value.trim();
  if(!v) return;
  if(isMuted(me)){ post(room, 0, 'أنت مكتوم', 1); return; }
  var now = Date.now(), md = rmode[room];
  if(lv(me) < 3){
    if(md === 'للقراءة فقط'){ post(room, 0, 'الغرفة للقراءة فقط', 1); return; }
    if(md === 'بطيء' && now-(me.lt||0) < 10000){ post(room, 0, 'الوضع بطيء: كل 10 ثوانٍ', 1); return; }
  }
  fl = fl.filter(function(x){ return now-x < 5000; });
  if(fl.length >= 4 && lv(me) < 3){ post(room, 0, 'أبطئ قليلاً', 1); return; }
  fl.push(now); me.lt = now;
  $('txt').value=''; grow();
  var c = v.split(' ')[0];
  if(c === '/clear'){ hist[room] = []; draw(); return; }
  if(c === '/dice' || c === '/me' || c === '/poll'){ rcmd(v); return; }
  rsend(v);
}

    b.onclick = function(){

      soc('shop/daily',{},function(r){
        if(r.j&&r.j.ok){ toast('🎁 +'+r.j.gain); shopView('tasks'); }
        else toast('⚠️ '+((r.j&&r.j.error)||'تعذر'));

          else toast('⚠️ '+((r.j&&r.j.error)||'تعذر')));

      };
      cd.appendChild(cb);
      w.appendChild(cd);
    });
    if(d.tx && d.tx.length){
      var h = el('div','nw');
      h.appendChild(el('b','','🧾 آخر المعاملات'));
      d.tx.slice(0,10).forEach(function(x){
        h.appendChild(el('small','mu',x.text));

        {k:'n',l:'الاسم'},
        {k:'p',l:'السعر',t:'number',min:1},
        {k:'t',l:'النوع',ch:[['اسم','name'],['إطار','frame'],['ثيم','theme'],['خلفية','bg'],['فقاعة','bubble'],['لقب','title']]},
        {k:'r',l:'الندرة',ch:[['عادي','common'],['نادر','rare'],['أسطوري','epic'],['محدود','ltd']]},
        {k:'v',l:'القيمة (لون #rrggbb أو نص)'}

        soc('shop/admin/add',o,function(r){
          if(r.j&&r.j.ok){ toast('✅ أُضيف'); shopView('adm'); }
          else toast('⚠️ '+((r.j&&r.j.error)||'تعذر'));
        });
      });
    };
    w.appendChild(ab);
    d.items.forEach(function(i){

      c.appendChild(el('b','',i.n+' · '+i.p+' 🪙 · مبيعات: '+(i.sales||0)));

}

function pickT(a){

function userFile(t){
  if(lv(me) < 2){ toast('⛔'); return; }
  box('📜 '+t.name, function(c){
    var w = el('div'); w.appendChild(el('small','mu','جارٍ التحميل...'));
    c.appendChild(w);
    function load(){
      api('mod/history?target='+t.id).then(function(r){
        w.textContent = '';
        if(!(r.j && r.j.sanctions)){ w.appendChild(el('small','mu','⚠️ '+((r.j&&r.j.error)||'تعذر'))); return; }
        var j = r.j;
        w.appendChild(el('small','mu','تحذيرات: '+j.warns+' / '+WN+' · بلاغات: '+j.reports.total+' (معلّقة '+j.reports.open+')'));
        w.appendChild(el('b','','العقوبات'));
        if(!j.sanctions.length) w.appendChild(el('small','mu','لا عقوبات.'));
        j.sanctions.forEach(function(x){
          var on = x.active && (!x.until || x.until > j.now);
          w.appendChild(el('div','',(on?'🟢 ':'⚪ ')+x.kind+(x.room?' ('+x.room+')':'')+' — '+x.by_name+' · '+ago(x.ts)));
        });
        w.appendChild(el('b','','📝 ملاحظات سرية'));
        if(!j.notes.length) w.appendChild(el('small','mu','لا ملاحظات.'));
        j.notes.forEach(function(n){
          w.appendChild(el('div','',n.by_name+': '+n.text+' · '+ago(n.ts)));
        });
        var i = el('input'); i.placeholder = 'ملاحظة جديدة...';
        var b = el('button','','حفظ');
        b.onclick = function(){
          if(!i.value.trim()) return;
          soc('mod/note',{target:t.id,text:i.value.trim()},function(r){
            if(r.j&&r.j.ok) load();
            else toast('⚠️ '+((r.j&&r.j.error)||'تعذر'));
          });
        };
        w.appendChild(i); w.appendChild(b);
      },function(){ w.textContent=''; w.appendChild(el('small','mu','⚠️ تعذر الاتصال')); });
    }
    load();
  });
}

/* ============================================================
   كلمات المراقبة (محلية)
   ============================================================ */
var WW = [], WWC = {};
function wwSave(){ WWC = {}; try { localStorage.setItem('chatww', JSON.stringify(WW)); } catch(e){} }
function wwLoad(){
  try { WW = JSON.parse(localStorage.getItem('chatww')||'[]'); } catch(e){ WW = []; }
  if(!Array.isArray(WW)) WW = [];
}
function wwNorm(s){ return String(s).replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').toLowerCase().trim(); }
function wwView(){
  if(me.role !== 'owner') return;
  wwLoad();
  box('🔤 كلمات المراقبة', function(c){
    c.appendChild(el('small','mu','تُحفظ في هذا المتصفح فقط.'));
    var i = el('input'); i.placeholder='كلمة جديدة...';
    var sel = el('select');
    [['0','تظليل'],['1','تظليل + تنبيه']].forEach(function(o){
      var p = el('option','',o[1]); p.value=o[0]; sel.appendChild(p);
    });
    var ad = el('button','','إضافة');
    ad.onclick = function(){
      var w = i.value.trim();
      if(w.length < 2) return;
      WW.push({w:w, on:1, al:sel.value==='1'?1:0});
      wwSave(); i.value=''; wwView();
    };
    c.appendChild(i); c.appendChild(sel); c.appendChild(ad);
    WW.forEach(function(e, idx){
      var d = el('div','nw');
      d.appendChild(el('b','',e.w));
      var tb = el('button',e.on?'':'g',e.on?'✅':'⏸️');
      tb.onclick = function(){ e.on = e.on?0:1; wwSave(); wwView(); };
      d.appendChild(tb);
      var db = el('button','g','🗑️');
      db.onclick = function(){ WW.splice(idx,1); wwSave(); wwView(); };
      d.appendChild(db);
      c.appendChild(d);
    });
  });
}
wwLoad();

var _notifyOrig = notify;
notify = function(ty,t,uid){
  if(ST.nt[ty]===0) return;
  if(ST.q){
    var h = new Date().getHours();
    var q = ST.qa > ST.qb ? (h>=ST.qa || h<ST.qb) : (h>=ST.qa && h<ST.qb);
    if(q){ notes.unshift({ty:ty,t:t,ts:Date.now(),r:0,uid:uid}); nb(); return; }
  }
  _notifyOrig(ty,t,uid);
};
